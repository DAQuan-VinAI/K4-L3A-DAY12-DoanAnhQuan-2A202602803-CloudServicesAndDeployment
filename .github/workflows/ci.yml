# CI/CD: mỗi lần push/PR → chạy test + build image trên máy sạch;
# chỉ khi cả hai xanh và là push lên main → deploy Railway rồi smoke test.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (CP1–CP4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Bỏ test_cp5 (gọi vào bản deploy đang sống) và test_bonus_cicd (tự kiểm
      # tra badge của chính workflow này). Build Docker để job `build` lo.
      - name: Run pytest
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        run: >
          pytest tests/ -v -m "not docker"
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t day12-agent:${{ github.sha }} .

      - name: Image size
        run: docker images day12-agent:${{ github.sha }} --format "{{.Size}}"

  deploy:
    name: Deploy to Railway
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Hai lần push liền nhau không deploy chồng lên nhau
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Chưa có secret RAILWAY_TOKEN (tài khoản Railway trial chưa tạo được
      # token) → bỏ qua bước deploy, vẫn smoke test bản đang chạy.
      - name: Skip deploy (no RAILWAY_TOKEN)
        if: env.RAILWAY_TOKEN == ''
        run: echo "::warning::Chưa có secret RAILWAY_TOKEN — bỏ qua deploy, chỉ smoke test bản đang chạy."

      - uses: actions/setup-node@v4
        if: env.RAILWAY_TOKEN != ''
        with:
          node-version: "20"

      - name: Install Railway CLI
        if: env.RAILWAY_TOKEN != ''
        run: npm install -g @railway/cli@5.62.1

      - name: Deploy
        if: env.RAILWAY_TOKEN != ''
        run: railway up --service agent --ci

      # Deploy xong chưa chắc service còn sống — gọi thử /health và /ready
      - name: Smoke test
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "$PUBLIC_URL/health" && curl -fsS "$PUBLIC_URL/ready"; then
              echo; echo "Smoke test OK"; exit 0
            fi
            echo "chưa sẵn sàng, thử lại sau 10s ($i/12)"; sleep 10
          done
          exit 1
